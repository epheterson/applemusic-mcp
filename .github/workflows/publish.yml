name: publish

# Action pinning policy: every `uses:` is pinned to a full commit SHA with its version in a
# comment, first-party or not, because a moved tag is the supply-chain risk. Dependabot
# security updates move a pin when an advisory affects it; routine bumps are by hand.
#
# What a release carries: a GitHub build-provenance attestation for the sdist and wheel
#   gh attestation verify dist/<file> --repo epheterson/applemusic-mcp
# and an SPDX SBOM, uploaded as the `sbom` workflow artifact. PyPI's own attestations
# come from the trusted-publishing step below.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC: the provenance attestation's signing identity
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distributions
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing — no API token needed in repo secrets.
    # Configure once at https://pypi.org/manage/project/applemusic-mcp/settings/publishing/
    # with publisher: GitHub, owner: epheterson, repo: applemusic-mcp,
    # workflow: publish.yml, environment: pypi
    environment:
      name: pypi
      url: https://pypi.org/project/applemusic-mcp/
    permissions:
      id-token: write # trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned like everything else (see the policy at the top of the file);
        # Dependabot moves it if an advisory lands against it.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Without this, a re-dispatch after an already-successful upload
          # fails here with "file already exists" and skips the registry job
          # below — leaving no way to retry a registry publish that failed
          # for a transient reason (the registry returns 429/5xx as
          # "retry later") short of burning a version bump.
          skip-existing: true

  registry:
    name: Publish to MCP Registry
    # After PyPI: the registry entry advertises a pypi package at this version,
    # so it must not point at a version that failed to publish.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # OIDC proves the job runs in this repo, which is what authorizes the
      # io.github.epheterson/* namespace. No secret, no stored token.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        # Third party, and a plain binary rather than an action. A release tag
        # and its assets are both mutable, so the version alone gives
        # reproducibility but no integrity — and this binary is then handed an
        # OIDC token with authority over the io.github.epheterson/* namespace.
        # Pin the digest too, per the policy at the top of this file. Bump both
        # deliberately.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Verify server.json agrees with the release
        # server.json has no other CI and does not follow an edit to
        # pyproject.toml, so it is exactly the surface that drifts. This is a
        # last check before advertising, not the gate that protects a release:
        # by now the tag, the GitHub Release, and PyPI have all happened. The
        # gate is the same script run pre-tag in release.yml.
        run: python3 scripts/check_versions.py

      - name: Wait for PyPI to serve the new version
        # The registry validates the entry by fetching
        # pypi.org/pypi/<pkg>/<version>/json and treats a 404 as a failure.
        # PyPI's JSON API trails the upload by seconds, so poll instead of
        # racing it.
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/applemusic-mcp/${ver}/json"; then
              echo "PyPI is serving ${ver}"
              exit 0
            fi
            echo "attempt ${i}: PyPI has no ${ver} yet"
            sleep 10
          done
          echo "PyPI never served ${ver}" >&2
          exit 1

      - name: Publish to MCP Registry
        # The registry answers 429/5xx as "likely transient, retry later", so
        # retry rather than leaving the entry a version behind. A duplicate is
        # treated as success: it means an earlier attempt landed and only the
        # response was lost, and republishing a version is impossible anyway.
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          for i in 1 2 3; do
            out=$(./mcp-publisher publish server.json 2>&1) && { echo "$out"; exit 0; }
            echo "$out"
            if echo "$out" | grep -q "duplicate version"; then
              echo "already published; treating as success"
              exit 0
            fi
            echo "publish attempt ${i} failed, retrying" >&2
            sleep 15
          done
          exit 1
