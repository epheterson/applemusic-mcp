name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pinning policy: first-party actions/* by tag; third-party by verified
      # SHA. See the note at the top of publish.yml.
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        env:
          PYVER: ${{ matrix.python-version }}
        run: uv python install "$PYVER"

      - name: Install project
        run: uv sync --all-extras --dev

      - name: Run tests + coverage
        # AppleScript-dependent tests (test_applescript.py) auto-skip on
        # non-darwin via pytestmark in the file. Cross-platform mock-based
        # tests run on every Python version. Coverage is gated by a regression
        # floor (fail_under in pyproject); the live TEST_API/TEST_UI gates and
        # macOS-only branches aren't exercised here, so this is a floor, not 100%.
        run: uv run pytest tests/ -q --tb=short --cov=applemusic_mcp --cov-report=term-missing

  fresh-install:
    name: fresh pip install (unpinned resolution)
    runs-on: ubuntu-latest
    steps:
      # The pytest job installs via `uv sync`, which resolves from uv.lock — a
      # dependency set users never get. When mcp 2.0.0 moved mcp.server.fastmcp,
      # the lock still held 1.28.1, so CI stayed green while EVERY fresh install
      # died on import (0.18.2). This job resolves dependencies the way pip does
      # for a user, with no lockfile, so an upstream major bump breaks CI before
      # it breaks installs.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from source with unpinned resolution
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install .

      - name: Import the server (the thing that actually broke)
        run: |
          /tmp/fresh/bin/python - <<'PY'
          import applemusic_mcp
          from applemusic_mcp import server, amp_api, cli  # noqa: F401
          print("imported OK:", applemusic_mcp.__version__)
          PY

      - name: Show what was resolved
        # Printed so a future breakage names the culprit version in the log.
        run: /tmp/fresh/bin/pip list

  mcp-2x:
    name: pytest against mcp 2.x
    runs-on: ubuntu-latest
    steps:
      # The pytest job resolves mcp from uv.lock, which holds a 1.x release. Both
      # majors are supported (server.py aliases the renamed module), so one of them
      # would otherwise go untested and rot silently — which is exactly how the 2.0
      # rename reached users in the first place.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with mcp 2.x forced
        run: |
          python -m venv /tmp/mcp2
          /tmp/mcp2/bin/pip install --upgrade pip
          /tmp/mcp2/bin/pip install . pytest pytest-mock responses
          /tmp/mcp2/bin/pip install "mcp>=2,<3"
          /tmp/mcp2/bin/pip list | grep -i "^mcp "

      - name: Run the suite
        # Browser tests need Playwright, which is a darwin-optional extra and not
        # installed here; they are covered by the main pytest matrix.
        run: /tmp/mcp2/bin/python -m pytest tests/ -q --tb=short --ignore=tests/test_browser_cov.py
