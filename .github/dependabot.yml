# Weekly version updates, grouped so a quiet week is one pull request per ecosystem.
# Security updates are separate and come as soon as an advisory lands.
version: 2

updates:
  # pyproject.toml + uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      python-minor:
        update-types: [minor, patch]

  # Every action is pinned to a commit; this keeps the pins and their version comments current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
